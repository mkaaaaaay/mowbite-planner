# Parameters of the MowBite Planner. Write doubles with a decimal point (0.0, not 0): rclpy refuses an
# int for a double parameter and doesn't start. /** matches the node whatever it's called (node_name).
/**:
  ros__parameters:
    frame_id: map
    # cutting width and how much neighbouring lanes overlap (0.15 = 15 %), lane spacing = 0.22 * 0.85
    mower_width: 0.22
    overlap: 0.15
    # loops along the outline and around every obstacle before the lanes (0..255)
    perimeter_passes: 2
    # first loop this far inside the outline. Negative: mower_width / 2 (the blade's edge on the outline).
    # 0.0 for outlines recorded by driving the mower's centre along the edge, like OpenMower does
    perimeter_offset: -1.0
    # loops first or last (last mows over the marks the turns leave), ccw, cw or auto (the way the mower faces)
    perimeter_order: first
    perimeter_direction: auto
    # lanes reach this many loops further out (OpenMower's outline_overlap_count)
    lane_overlap_passes: 0
    # inside the loops: lanes, crosshatch (lanes, then lanes at crosshatch_angle_deg to them), concentric or auto
    # (lanes or concentric, whichever turns least tightly)
    fill_pattern: lanes
    crosshatch_angle_deg: 90.0
    # lane direction: longest_edge, min_width, optimal (fewest lanes, tried angle_step_deg apart) or fixed
    # (fixed_angle_deg), plus angle_offset_deg. It stays within angle_min_deg..angle_max_deg (both or neither,
    # .nan: no range). Not for ~/plan_path: OpenMower sends the angle with its own offset
    angle_strategy: longest_edge
    fixed_angle_deg: 0.0
    angle_offset_deg: 0.0
    angle_min_deg: .nan
    angle_max_deg: .nan
    angle_step_deg: 5.0
    # turns between lanes: arcs of this radius. Where a forward turn doesn't fit, a K-turn backs up a
    # little (allow_reverse). OpenMower's FTC controller only drives forwards: there use
    # allow_reverse: false and lane_order: skip (every turn a forward U-turn of turn_radius).
    # These and waypoint_spacing also apply to ~/plan_path, the rest comes with its request
    turn_radius: 0.25
    # no arc of a turn, a drive, a loop out or a K-turn tighter than this [m] (about half the track of the drive
    # wheels: tighter, the inner wheel stands or turns backwards and scuffs the lawn), turning on the spot instead
    min_turn_radius: 0.0
    allow_reverse: true
    # the turns allowed, preferred first
    turn_types: [u_turn, bulb, k_turn, detour, pivot]
    lane_order: snake
    # cells: nearest (the closest one not mowed yet next) or optimized (shortest drives between them)
    route_order: nearest
    perimeter_corner_radius: 0.15
    waypoint_spacing: 0.10
    transit_clearance: 0.05
    simplify_tolerance: 0.01
    min_lane_length: 0.10
    # the mower's body [m] around its centre (base_link): robot_width wide, robot_front ahead, robot_rear behind
    # (negative: not set). With all three the turns, lane ends, loops and drives keep it in: on recorded edges
    # (the outline and obstacles are where the centre drove) where it was when they were recorded, on hard ones
    # (walls) not past them, the centre keeps robot_width / 2 off them. blade_offset: the blade's centre this far
    # left of the mower's (negative: right), the loops then go round with the blade on their outer side
    # where the lanes would lie in a part narrower than their turns need (a path, a strip between beds): lanes
    # anyway, or loops further in there, the pieces they come apart into driven on the way round (with
    # fill_pattern concentric all the loops, a part in one go)
    narrow_parts: lanes
    robot_width: -1.0
    robot_front: -1.0
    robot_rear: -1.0
    edges: recorded
    # how much further the body may reach than the edges allow [m] (a recorded edge is a few cm off)
    body_tolerance: 0.05
    blade_offset: 0.0
    # the blade's centre this far ahead of the mower's centre (OpenMower's base_link between the drive wheels),
    # negative: behind it. The lanes start and end that much earlier
    blade_ahead: 0.0
    # a row split by an obstacle with at most bend_max_gap between its pieces becomes one lane bending around it,
    # at most bend_max_offset off its line (0.0: split, a cell on either side)
    bend_max_gap: 0.0
    bend_max_offset: 0.5
    # transits keep transit_edge_distance off the edges where that costs little more: every metre closer
    # counts transit_edge_cost more (0.0: the shortest way)
    transit_edge_distance: 0.0
    transit_edge_cost: 2.0
    publish_path: true
    # ~/plan_path splits longer paths (OpenMower counts the poses of a path in an int16), at least 4
    max_path_poses: 30000
    # only for the ~/plan_from_parameters service, an example garden (leave both out if not needed):
    # boundary_polygon: [0.0, 0.0, 20.0, 0.0, 20.0, 8.0, 12.0, 8.0, 12.0, 15.0, 0.0, 15.0]
    # obstacles: ["4.0,4.0; 6.0,4.0; 6.0,6.0; 4.0,6.0", "14.0,2.0; 17.0,2.0; 17.0,4.0; 14.0,4.0"]
