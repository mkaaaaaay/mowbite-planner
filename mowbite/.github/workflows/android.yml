name: android

# builds the android app and puts the apk on a release: a version tag (v1.2.3) gets its own release
# with MowBite.apk, dev keeps rebuilding the "app-dev" pre-release. signed with the key from the repo
# secrets, so a new version installs over the old one

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_SUFFIX: ${{ github.ref_name == 'dev' && format('dev.{0}', github.run_number) || '' }}
    steps:
      - id: key
        env:
          KEYSTORE: ${{ secrets.MOWBITE_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no signing key in the repo secrets (MOWBITE_KEYSTORE), apk not built"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi

      - if: steps.key.outputs.skip != '1'
        uses: actions/checkout@v7

      - if: steps.key.outputs.skip != '1'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - if: steps.key.outputs.skip != '1'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - if: steps.key.outputs.skip != '1'
        uses: android-actions/setup-android@v4

      - if: steps.key.outputs.skip != '1'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0" > /dev/null
          npm ci
          npm run build
          npx cap sync android

      - if: steps.key.outputs.skip != '1'
        working-directory: android
        env:
          MOWBITE_KEYSTORE: ${{ runner.temp }}/release.jks
          MOWBITE_KEYSTORE_PASSWORD: ${{ secrets.MOWBITE_KEYSTORE_PASSWORD }}
          MOWBITE_KEY_ALIAS: ${{ secrets.MOWBITE_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon -q

      - if: steps.key.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$(node -p 'require("./package.json").version')" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match the version in package.json"
              exit 1
            fi
            cp "$apk" MowBite.apk
            # the release notes are the message of the annotated tag, the checkout only has the commit
            git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            # a version like 1.3.0-beta.1 becomes a pre-release and doesn't replace the latest one
            case "$version" in *-*) kind="--prerelease --latest=false" ;; *) kind="--latest" ;; esac
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --verify-tag $kind --title "MowBite $version" --notes-from-tag
            gh release upload "$GITHUB_REF_NAME" MowBite.apk --clobber
          else
            cp "$apk" MowBite-dev.apk
            gh release view app-dev > /dev/null 2>&1 || gh release create app-dev --prerelease --title "MowBite app (dev)" \
              --notes "Test version from the dev branch, might be broken. Rebuilt with every change on dev." --target "$GITHUB_SHA"
            gh release upload app-dev MowBite-dev.apk --clobber
            # the tag follows the newest build
            git tag -f app-dev && git push -f origin refs/tags/app-dev
          fi
