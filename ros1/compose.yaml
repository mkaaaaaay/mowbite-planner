# MowBite Planner: a Dockge stack of its own next to OpenMower, see ros1/README.md
services:
  mowbite_planner:
    build:
      context: https://github.com/mkaaaaaay/mowbite-planner.git#main
      dockerfile: ros1/Dockerfile
      args:
        OPENMOWER_IMAGE: ghcr.io/clemenselflein/open_mower_ros:${OPENMOWER_VERSION:-edge}
    image: mowbite_planner:${OPENMOWER_VERSION:-edge}
    pull_policy: build  # Dockge's Update builds the newest planner
    container_name: mowbite_planner
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/openmower/ros:/data/ros
    environment:
      - ROS_HOME=/data/ros
      - OM_BLADE_WIDTH=${OM_BLADE_WIDTH:-0.18}
      - MOWBITE_WEB_PORT=${MOWBITE_WEB_PORT:-8090}
      - MOWBITE_WORKERS=${MOWBITE_WORKERS:-3}
