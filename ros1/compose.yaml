# MowBite Planner: a Dockge stack of its own next to OpenMower, see ros1/README.md
services:
  mowbite_planner:
    build:
      context: https://github.com/mkaaaaaay/mowbite-planner.git#main
      dockerfile: ros1/Dockerfile
      args:
        # OpenMower's VERSION (its .env): the planner is built on that image, the messages have to be the same
        OPENMOWER_IMAGE: ghcr.io/clemenselflein/open_mower_ros:${OPENMOWER_VERSION:-latest}
    image: mowbite_planner:${OPENMOWER_VERSION:-latest}
    pull_policy: build  # Dockge's Update builds the newest planner
    container_name: mowbite_planner
    restart: unless-stopped
    # the mower's disk is small: the container's log kept to 2 files of 5 MB
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    network_mode: host
    volumes:
      - /home/openmower/ros:/data/ros
    environment:
      - ROS_HOME=/data/ros
      - OM_BLADE_WIDTH=${OM_BLADE_WIDTH:-0.18}
      - MOWBITE_WEB_PORT=${MOWBITE_WEB_PORT:-8090}
      - MOWBITE_WORKERS=${MOWBITE_WORKERS:-3}
